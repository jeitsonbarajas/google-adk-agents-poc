[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python production_start.py"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "always"

[env]
PYTHONPATH = "/app"
ENVIRONMENT = "gcp"
NODE_ENV = "production"

[[services]]
name = "google-adk-agents"

[services.variables]
PORT = "8080"
ADAPTER_SERVER_URL = "http://localhost:8080/api"

# Variables de entorno requeridas
# GOOGLE_API_KEY = "AIxxxx"